[package]
name = "bpdl"
version = "0.1.0"
edition = "2024"
description = "bplist files downloader"

[profile.release]
opt-level = "s"
# lto = "off"
# lto = "thin"
lto = "fat"
strip = true
codegen-units = 1
# panic = "abort"

[dependencies]
serde_json = "1.0.140"
tokio = { version = "1.44.2", features = ["full"] }
serde = { version = "1.0.219", features = ["derive"] }
clap = { version = "4.5.37", features = ["derive"] }
reqwest = { version = "0.12.15", features = ["stream"] }
tokio-stream = "0.1.17"
zip-extract = "0.2.2"
bytes = "1.10.1"
# crossterm = "0.29.0"
# tui = "0.19.0"
